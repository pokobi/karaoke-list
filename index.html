<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>カラオケリスト</title>
<meta name="description" content="カラオケで歌う曲と音域・キーのリスト">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e0f12" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="カラオケ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
<script>
  // テーマ・文字の大きさ・アクセントカラーを、画面が描かれる前に反映する（ちらつき防止）
  try {
    var p = JSON.parse(localStorage.getItem('karaoke-list:prefs:v1')) || {};
    var d = document.documentElement;
    if (p.theme === 'light' || p.theme === 'dark') d.dataset.theme = p.theme;
    if (p.density === 'compact' || p.density === 'large') d.dataset.density = p.density;
    if (typeof p.accent === 'string' && p.accent !== 'indigo') d.dataset.accent = p.accent;
  } catch (e) { /* 保存された設定がなければ既定のまま */ }
</script>
<script type="module" src="js/app.js"></script>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <defs>
    <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></symbol>
    <symbol id="i-filter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
    <symbol id="i-sort" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M4 12h7M4 18h4M17 5v14M14 16l3 3 3-3"/></symbol>
    <symbol id="i-arrow-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6.5 13.5 12 19l5.5-5.5"/></symbol>
    <symbol id="i-arrow-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6.5 10.5 12 5l5.5 5.5"/></symbol>
    <symbol id="i-dice" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="4"/><circle cx="9" cy="9" r=".9" fill="currentColor"/><circle cx="15" cy="15" r=".9" fill="currentColor"/><circle cx="15" cy="9" r=".9" fill="currentColor"/><circle cx="9" cy="15" r=".9" fill="currentColor"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M12 3.6l2.5 5.2 5.7.8-4.1 4 1 5.7L12 16.6l-5.1 2.7 1-5.7-4.1-4 5.7-.8z"/></symbol>
    <symbol id="i-star-fill" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M12 3.6l2.5 5.2 5.7.8-4.1 4 1 5.7L12 16.6l-5.1 2.7 1-5.7-4.1-4 5.7-.8z"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
    <symbol id="i-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 6l6 6-6 6"/></symbol>
    <symbol id="i-chevron-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9.5l6 6 6-6"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V9M7 14l5-5 5 5M5 4h14"/></symbol>
    <symbol id="i-logout" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l5-5-5-5M15 12H4"/></symbol>
    <symbol id="i-login" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h3M14 17l5-5-5-5M19 12H8"/></symbol>
    <symbol id="i-tag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12.2V4.5a1 1 0 0 1 1-1h7.7l8.3 8.3-8.7 8.7z"/><circle cx="8" cy="8" r="1.3"/></symbol>
    <symbol id="i-music" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5.5l11-2V16"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r=".8" fill="currentColor"/><circle cx="4.5" cy="12" r=".8" fill="currentColor"/><circle cx="4.5" cy="18" r=".8" fill="currentColor"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19.5 11A7.5 7.5 0 0 0 6 6.6L4.5 8M4.5 4v4h4M4.5 13A7.5 7.5 0 0 0 18 17.4l1.5-1.4M19.5 20v-4h-4"/></symbol>
    <symbol id="i-reset" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3L4.5 9M4.5 4.5V9H9"/></symbol>
    <symbol id="i-select" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="M8 12.3l2.8 2.8L16.5 9"/></symbol>
    <symbol id="i-pen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="3"/><circle cx="9" cy="9" r="1.6"/><path d="M20.5 15.5l-4.5-4.5-9.5 9.5"/></symbol>
    <symbol id="i-history" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7L4 8.6M4 4v4.6h4.6M12 8v4.5l3 2"/></symbol>
    <symbol id="i-octave" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5v9M8 9l4 4 4-4M12 14.5v6M8 17l4 4 4-4"/></symbol>
  </defs>
</svg>

<div id="boot" class="boot" aria-busy="true" aria-label="読み込み中"><div class="spinner"></div></div>

<section id="login" class="login" hidden>
  <div class="login-card">
    <img class="login-icon" src="icons/icon.svg" alt="" width="72" height="72">
    <p class="login-text">Google アカウントでログインすると、スマホと PC で同じリストを使えます。</p>
    <button type="button" id="btn-login" class="btn primary wide"><svg class="ic" aria-hidden="true"><use href="#i-login"/></svg>Google でログイン</button>
    <p id="login-error" class="login-error" role="alert" hidden></p>
  </div>
</section>

<div id="fatal" class="fatal" role="alert" hidden></div>

<div id="app" class="app" hidden>
  <aside id="sidebar" class="sidebar">
    <div id="filter-panel" class="filter-panel">
      <div class="sheet-head fp-head">
        <h3>絞り込み</h3>
        <button type="button" class="link-btn" data-act="reset">すべて解除</button>
        <button type="button" class="icon-btn fp-close" data-act="close" aria-label="閉じる"><svg class="ic" aria-hidden="true"><use href="#i-close"/></svg></button>
      </div>
      <div class="sheet-body fp-body">
        <label class="switch-row"><span>お気に入りのみ</span><input type="checkbox" id="f-fav" class="switch"></label>
        <label class="switch-row"><span>音域が未入力の曲のみ</span><input type="checkbox" id="f-missing" class="switch"></label>
        <div class="fp-sec">
          <label class="label" for="f-artist">アーティスト</label>
          <select id="f-artist" class="input select"></select>
        </div>
        <div class="fp-sec">
          <span class="label">タグ</span>
          <div id="f-tags" class="chip-set"></div>
        </div>
        <div class="fp-sec">
          <div class="label-row">
            <span class="label">音域</span>
            <div class="seg seg-sm" id="f-basis" role="group" aria-label="音域の基準">
              <button type="button" data-v="current">キー適用後</button>
              <button type="button" data-v="original">原曲</button>
            </div>
          </div>
          <div id="f-range" class="rf"></div>
          <p class="hint">指定した範囲に収まる曲だけを表示します。並び替えの音域も、この基準で比べます。</p>
        </div>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="toolbar">
      <div class="tb-row">
        <label class="search">
          <svg class="ic" aria-hidden="true"><use href="#i-search"/></svg>
          <input id="q" type="search" placeholder="曲名やアーティストで検索" autocomplete="off" enterkeyhint="search" aria-label="検索">
          <button type="button" id="q-clear" class="q-clear" aria-label="検索を消す" hidden><svg class="ic" aria-hidden="true"><use href="#i-close"/></svg></button>
        </label>
        <button type="button" id="btn-filter" class="icon-btn tb-btn" aria-label="絞り込み"><svg class="ic" aria-hidden="true"><use href="#i-filter"/></svg><span class="dot" hidden></span></button>
        <button type="button" id="btn-menu" class="icon-btn tb-btn" aria-label="設定"><svg class="ic" aria-hidden="true"><use href="#i-menu"/></svg></button>
      </div>
      <div class="tb-sub">
        <span id="count" class="count" aria-live="polite"></span>
        <div class="tb-tools">
          <button type="button" id="btn-sort" class="tool-btn" aria-haspopup="menu"><svg class="ic" aria-hidden="true"><use href="#i-sort"/></svg><span id="sort-label"></span></button>
          <button type="button" id="btn-sort-dir" class="tool-btn icon-only"></button>
          <button type="button" id="btn-select" class="tool-btn icon-only" aria-label="曲を選んでまとめて操作"><svg class="ic" aria-hidden="true"><use href="#i-select"/></svg></button>
          <button type="button" id="btn-random" class="tool-btn" aria-label="ランダム選曲"><svg class="ic" aria-hidden="true"><use href="#i-dice"/></svg><span class="tool-txt">ランダム</span></button>
        </div>
      </div>
      <div id="chips" class="active-chips" hidden></div>
    </header>
    <ul id="list" class="list" aria-label="曲の一覧"></ul>
    <div id="empty" class="empty" hidden></div>
  </main>

  <div id="selbar" class="selbar" role="toolbar" aria-label="選んだ曲の操作" hidden>
    <div class="selbar-top">
      <span id="sel-count" class="sel-count" aria-live="polite"></span>
      <button type="button" class="link-btn" data-sel="all">表示中をすべて選ぶ</button>
      <button type="button" class="link-btn" data-sel="done">完了</button>
    </div>
    <div class="selbar-actions">
      <button type="button" class="btn" data-sel="tag"><svg class="ic" aria-hidden="true"><use href="#i-tag"/></svg>タグ</button>
      <button type="button" class="btn" data-sel="fav"><svg class="ic" aria-hidden="true"><use href="#i-star"/></svg>お気に入り</button>
      <button type="button" class="btn danger-ghost" data-sel="delete"><svg class="ic" aria-hidden="true"><use href="#i-trash"/></svg>削除</button>
    </div>
  </div>

  <button type="button" id="fab" class="fab" aria-label="曲を登録"><svg class="ic" aria-hidden="true"><use href="#i-plus"/></svg></button>
</div>

<input type="file" id="csv-file" accept=".csv,text/csv" hidden>
<input type="file" id="history-file" accept=".json,.zip,application/json,application/zip" hidden>
</body>
</html>
